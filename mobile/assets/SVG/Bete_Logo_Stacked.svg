<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" width="100%" height="100%">
  <!-- Bete (ቤቴ) Centered Stacked Logo - Based on Concept #5 -->
  <defs>
    <linearGradient id="pinBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0047BA" />
    </linearGradient>
    <filter id="shadowFilter" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0052CC" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- ==================== CENTERED EMBLEM ==================== -->
  <g transform="translate(300, 190)">
    <!-- Blue Geo-Location Pin Outer Body -->
    <path d="M 0 -115 C 65 -115 116 -62 116 4 C 116 70 35 138 0 169 C -35 138 -116 70 -116 4 C -116 -62 -65 -115 0 -115 Z" 
          fill="url(#pinBlueGrad)" filter="url(#shadowFilter)" />

    <!-- Inner White Negative Space Core -->
    <circle cx="0" cy="7" r="73" fill="#FFFFFF" />

    <!-- Vibrant Orange House Roof & Chimney -->
    <!-- Roof Peak -->
    <path d="M -76 7 L 0 -60 L 76 7" fill="none" stroke="#FF6B00" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Chimney on Right -->
    <rect x="34" y="-48" width="14" height="22" fill="#FF6B00" rx="3" />

    <!-- 4-Pane Window in Center -->
    <g transform="translate(0, 11)">
      <rect x="-22" y="-22" width="18" height="18" rx="3" fill="#FF6B00" />
      <rect x="4" y="-22" width="18" height="18" rx="3" fill="#FF6B00" />
      <rect x="-22" y="4" width="18" height="18" rx="3" fill="#FF6B00" />
      <rect x="4" y="4" width="18" height="18" rx="3" fill="#FF6B00" />
    </g>

    <!-- Network Link Nodes at Bottom Tip (Connectivity) -->
    <path d="M -20 152 L -70 190" stroke="#0052CC" stroke-width="11" stroke-linecap="round" />
    <path d="M -70 190 L 14 206" stroke="#0052CC" stroke-width="11" stroke-linecap="round" />
    
    <circle cx="-70" cy="190" r="18" fill="#0052CC" />
    <circle cx="-70" cy="190" r="8" fill="#FFFFFF" />
    
    <circle cx="14" cy="206" r="19" fill="#FF6B00" />
    <circle cx="14" cy="206" r="8" fill="#FFFFFF" />
  </g>

  <!-- ==================== TYPOGRAPHY ==================== -->
  <g transform="translate(300, 485)">
    <!-- Primary Latin Wordmark: Bete -->
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="900" font-size="108" letter-spacing="-3">
      <tspan fill="#0052CC">Be</tspan><tspan fill="#0F172A">te</tspan>
    </text>

    <!-- Amharic Script: ቤቴ -->
    <text x="0" y="52" text-anchor="middle" font-family="'Nyala', 'Ebrima', 'Segoe UI', sans-serif" font-weight="bold" font-size="46" fill="#FF6B00">
      ቤቴ
    </text>

    <!-- Subtitle: HOME SERVICES & REPAIR -->
    <text x="0" y="100" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="18" letter-spacing="8" fill="#64748B">
      HOME REPAIR &amp; CARE
    </text>

    <!-- Ethiopian Subtitle: የቤትዎ ታማኝ አጋር -->
    <text x="0" y="132" text-anchor="middle" font-family="'Nyala', 'Ebrima', 'Segoe UI', sans-serif" font-weight="bold" font-size="18" fill="#0052CC" opacity="0.9">
      የቤትዎ ታማኝ አጋር
    </text>
  </g>
</svg>
