<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Bete (ቤቴ) Mobile App Launcher Icon (iOS / Android Squircle) -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="60%" stop-color="#0052CC" />
      <stop offset="100%" stop-color="#003599" />
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#001F66" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle App Container -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Subtle App Container Gloss Arc -->
  <path d="M 0 0 L 512 0 C 512 180 320 220 0 160 Z" fill="#FFFFFF" fill-opacity="0.06" />

  <!-- Centered Emblem Group -->
  <g transform="translate(256, 240)" filter="url(#iconShadow)">
    <!-- White Pin Outer Body -->
    <path d="M 0 -130 C 72 -130 130 -70 130 5 C 130 80 40 156 0 190 C -40 156 -130 80 -130 5 C -130 -70 -72 -130 0 -130 Z" 
          fill="#FFFFFF" />

    <!-- Royal Blue Inner Well -->
    <circle cx="0" cy="8" r="82" fill="#0052CC" />

    <!-- Pure White / Orange House Roof & Chimney -->
    <path d="M -60 8 L 0 -45 L 60 8" fill="none" stroke="#FF6B00" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="26" y="-36" width="12" height="18" fill="#FF6B00" rx="2" />

    <!-- 4-Pane Window inside Pin (White on Blue) -->
    <g transform="translate(0, 15)">
      <rect x="-18" y="-18" width="15" height="15" rx="3" fill="#FFFFFF" />
      <rect x="3" y="-18" width="15" height="15" rx="3" fill="#FFFFFF" />
      <rect x="-18" y="3" width="15" height="15" rx="3" fill="#FFFFFF" />
      <rect x="3" y="3" width="15" height="15" rx="3" fill="#FFFFFF" />
    </g>

    <!-- Connected Link Nodes at Bottom -->
    <path d="M -22 170 L -78 214" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
    <path d="M -78 214 L 18 232" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />

    <circle cx="-78" cy="214" r="20" fill="#FFFFFF" />
    <circle cx="-78" cy="214" r="9" fill="#0052CC" />

    <circle cx="18" cy="232" r="22" fill="#FF6B00" />
    <circle cx="18" cy="232" r="10" fill="#FFFFFF" />
  </g>
</svg>
